<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fault List - Street Light Register</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: #f4f6f8;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 4px;
        }
        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .controls input,
        .controls select {
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            flex: 1;
            min-width: 160px;
        }
        .controls input:focus,
        .controls select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .controls button {
            padding: 10px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .controls button:hover {
            background: #2563eb;
        }
        .controls .clear-btn {
            background: #94a3b8;
        }
        .controls .clear-btn:hover {
            background: #64748b;
        }
        .controls .refresh-btn {
            background: #22c55e;
        }
        .controls .refresh-btn:hover {
            background: #16a34a;
        }
        .record-count {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 16px;
            padding: 8px 12px;
            background: #f8fafc;
            border-radius: 6px;
            display: inline-block;
        }
        .table-wrapper {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        thead {
            background: #f1f5f9;
        }
        th {
            padding: 12px 14px;
            text-align: left;
            font-weight: 600;
            color: #334155;
            border-bottom: 2px solid #e2e8f0;
        }
        td {
            padding: 12px 14px;
            border-bottom: 1px solid #e2e8f0;
            color: #1e293b;
        }
        tr:hover {
            background: #f8fafc;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-Pending {
            background: #fef3c7;
            color: #92400e;
        }
        .status-InProgress {
            background: #dbeafe;
            color: #1e40af;
        }
        .status-Repaired {
            background: #dcfce7;
            color: #166534;
        }
        .days-badge {
            font-weight: 600;
            color: #dc2626;
        }
        .days-badge.zero {
            color: #94a3b8;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
            font-size: 16px;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }
        .empty-state h3 {
            font-size: 18px;
            color: #64748b;
            margin-bottom: 8px;
        }
        .empty-state button {
            margin-top: 12px;
            padding: 8px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .error-state {
            text-align: center;
            padding: 40px 20px;
            color: #991b1b;
            background: #fee2e2;
            border-radius: 8px;
            border: 1px solid #fecaca;
        }
        .error-state button {
            margin-top: 12px;
            padding: 8px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .nav-link {
            display: inline-block;
            margin-top: 20px;
            color: #3b82f6;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
        .divider {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin: 20px 0;
        }
        .highlight {
            background-color: #fef9c3 !important;
        }
        .missing {
            color: #94a3b8;
            font-style: italic;
        }

        .repair-btn {
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
            margin-left: 8px;
        }
        .repair-btn:hover {
            background: #16a34a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📋 Street Light Fault Register</h1>
        <p class="subtitle">Electrical Section — view, search, and filter all reported faults</p>

        <!-- Controls -->
        <div class="controls">
            <input type="text" id="searchInput" placeholder="🔍 Search by pole or street..." />
            <select id="statusFilter">
                <option value="">All Statuses</option>
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Repaired">Repaired</option>
            </select>
            <button id="searchBtn">Search</button>
            <button id="clearBtn" class="clear-btn">Clear</button>
            <button id="refreshBtn" class="refresh-btn">↻ Refresh</button>
        </div>

        <!-- Record Count -->
        <div class="record-count" id="recordCount">Loading records...</div>

        <!-- Table -->
        <div class="table-wrapper" id="tableContainer">
            <div class="loading">Loading faults</div>
        </div>

        <hr class="divider" />

        <a href="/" class="nav-link">➕ Report a New Fault →</a>
    </div>

    <script>
        const API_BASE = '/api/faults';
        const tableContainer = document.getElementById('tableContainer');
        const recordCount = document.getElementById('recordCount');
        const searchInput = document.getElementById('searchInput');
        const statusFilter = document.getElementById('statusFilter');
        const searchBtn = document.getElementById('searchBtn');
        const clearBtn = document.getElementById('clearBtn');
        const refreshBtn = document.getElementById('refreshBtn');

        let currentData = [];

        // ---- Fetch and render ----
        async function fetchFaults() {
            const search = searchInput.value.trim();
            const status = statusFilter.value;

            // Build URL with query params
            let url = API_BASE;
            const params = [];
            if (search) params.push(`search=${encodeURIComponent(search)}`);
            if (status) params.push(`status=${encodeURIComponent(status)}`);
            if (params.length > 0) url += '?' + params.join('&');

            // Show loading state
            tableContainer.innerHTML = '<div class="loading">Loading faults</div>';
            recordCount.textContent = 'Loading...';

            try {
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}`);
                }

                const data = await response.json();
                currentData = data.faults || [];
                renderTable(currentData);
                recordCount.textContent = `Showing ${currentData.length} record${currentData.length !== 1 ? 's' : ''}`;

            } catch (error) {
                // ---- ERROR STATE ----
                tableContainer.innerHTML = `
                    <div class="error-state">
                        <strong>❌ Failed to load faults</strong>
                        <p style="margin-top: 8px;">${error.message || 'Please check your connection and try again.'}</p>
                        <button onclick="fetchFaults()">🔄 Retry</button>
                    </div>
                `;
                recordCount.textContent = '⚠️ Error loading records';
                console.error('Fetch error:', error);
            }
        }

        // ---- Update fault status ----
        async function updateStatus(id, newStatus, version) {
            const confirmed = confirm(`Mark fault #${id} as "${newStatus}"?`);
            if (!confirmed) return;

            try {
                const response = await fetch(`/api/faults/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        status: newStatus, 
                        version: version 
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    if (response.status === 409) {
                        alert('❌ Conflict! Another user updated this fault. Refreshing...');
                    } else {
                        alert(data.error || 'Update failed');
                    }
                    fetchFaults(); // Refresh to get latest data
                    return;
                }

                alert(`✅ Fault #${id} marked as ${newStatus}!`);
                fetchFaults(); // Refresh the list

            } catch (error) {
                alert('❌ Network error. Please check your connection.');
                console.error('Update error:', error);
            }
        }

        // ---- Render the table ----
        function renderTable(faults) {
            if (!faults || faults.length === 0) {
                // ---- EMPTY STATE ----
                tableContainer.innerHTML = `
                    <div class="empty-state">
                        <h3>📭 No faults found</h3>
                        <p>Try adjusting your search or filter criteria.</p>
                        <button onclick="clearFilters()">Clear Filters</button>
                    </div>
                `;
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Pole</th>
                            <th>Ward</th>
                            <th>Street</th>
                            <th>Fault Type</th>
                            <th>Status</th>
                            <th>Reported</th>
                            <th>Days</th>
                            <th>Repaired</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            faults.forEach(f => {
                const statusClass = `status-${f.status.replace(/\s/g, '')}`;
                const days = f.days_outstanding || 0;
                const daysClass = days === 0 ? 'days-badge zero' : 'days-badge';
                
                // Highlight rows with no ward (awkward case)
                const highlightClass = !f.ward ? 'highlight' : '';

                html += `
                    <tr class="${highlightClass}">
                        <td><strong>${f.fault_id}</strong></td>
                        <td>${f.pole_id || 'N/A'}</td>
                        <td>${f.ward || '<span class="missing">(missing)</span>'}</td>
                        <td>${f.street || 'N/A'}</td>
                        <td>${f.fault_type || 'N/A'}</td>
                        <td><span class="status-badge ${statusClass}">${f.status}</span></td>
                        <td>${f.reported_date}</td>
                        <td class="${daysClass}">${days} day${days !== 1 ? 's' : ''}</td>
                        <td>
                            ${f.repaired_date || '—'}
                            ${f.status !== 'Repaired' ? `<button onclick="updateStatus(${f.fault_id}, 'Repaired', ${f.version})" class="repair-btn">✅ Fix</button>` : ''}
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            tableContainer.innerHTML = html;
        }

        // ---- Clear filters ----
        function clearFilters() {
            searchInput.value = '';
            statusFilter.value = '';
            fetchFaults();
        }

        // ---- Event listeners ----
        searchBtn.addEventListener('click', fetchFaults);
        clearBtn.addEventListener('click', clearFilters);
        refreshBtn.addEventListener('click', fetchFaults);

        // Enter key in search triggers search
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') fetchFaults();
        });

        // Status filter change triggers search automatically
        statusFilter.addEventListener('change', fetchFaults);

        // ---- Load on page load ----
        fetchFaults();
    </script>

</body>
</html>
